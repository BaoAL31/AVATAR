defaults:
  - checkpoint: last_k
  - data: default
  - debug: no_debug
  - decode: default
  - logger: default
  - logging: default
  - model: default
  - optimizer: default
  - trainer: train
  - _self_
  - override model/backbone: resnet_transformer_baseplus

hydra:
  output_subdir: null
  run:
    dir: ${checkpoint.dirpath}/${experiment_name}

project_name: semi_supervised_usr
experiment_name: usr_ft_lrs2_au_lora_8gb_test
num_workers: 14
# HF Hub download tqdm bars (only when fetching uncached files). Override: hub_disable_progress_bars=false
hub_disable_progress_bars: true
log_wandb: True
replace_sampler_ddp: False
# torch.compile can spike VRAM; turn on only if you have headroom after lowering frames_per_gpu.
compile_model: False
fix_seed: True
matmul_precision: high
ckpt_path:
gpus:
test: False
test_avg: False
txt_file:
slurm_job_id:

# Model/backbone for AU + LoRA finetuning
model:
  pretrained_model_path: /home/hoangbng/AVATAR/AVATAR/models/usr/checkpoints/baseplus_high_resource_lrs3vox2.pth
  pretrained_lm_path:
  transfer_only_encoder: False
  lora:
    enabled: True
  backbone:
    use_au: True

# Data — HF Hub sharded (manifest tags: lrs2_00..lrs2_14)
# Rebuild manifests with:
#   python scripts/build_lrs2_usr_manifest.py --staging <staging_dir> ...
#
# Path contract (must match dataset_ft.AVDataset + hub_local_path):
#   - CSV col2 = Hub filename for video, e.g. 0000000/0000000.mp4
#   - Same repo (HBaoAL/LRS2_XX) must also contain 0000000/0000000.wav and 0000000/0000000.npz
#     (same stem/path; only extension changes). Tags lrs2_XX map to repo {lrs2_repo_prefix}_XX.
#   - hf_hub_cache / HF_HUB_CACHE should match where Hub files were downloaded.
data:
  # Max sum of video frames per batch (clips packed until total ≈ this). Lower if CUDA OOM.
  # Each clip is also capped to this length (fairseq requires no sample longer than max_tokens).
  # Paired with trainer.accumulate_grad_batches: 2 (~same optimizer “size” as 1100 single-step, lower peak VRAM).
  frames_per_gpu: 1000
  # Only used by semi-supervised data_module.py, not FT — harmless to leave or remove.
  frames_per_gpu_labelled: 1000
  # Val/test: same role as frames_per_gpu; often equal or slightly lower than train.
  frames_per_gpu_val: 1000
  dataset:
    train_csv: /home/hoangbng/AVATAR/AVATAR/data/train_manifest.csv
    train_labelled_csv: /home/hoangbng/AVATAR/AVATAR/data/train_manifest.csv
    val_csv: /home/hoangbng/AVATAR/AVATAR/data/val_manifest.csv
    test_csv: /home/hoangbng/AVATAR/AVATAR/data/val_manifest.csv
  # Optional: limit CSV rows without rebuilding (see data/default.yaml). Example: max_train_samples: 8000
  # max_train_samples:
  # max_val_samples:
  hub:
    lrs2_repo_prefix: HBaoAL/LRS2
    # Keep false to avoid huge resolver spikes / 429s on large manifests.
    prefetch_manifest: false
    # If you explicitly turn prefetch on, keep this low.
    prefetch_max_workers: 2
  au:
    enabled: True

decode:
  lm_weight: 0.0

# Keep single-process defaults for local 1-GPU testing
trainer:
  strategy: auto
  devices: 1
  num_nodes: 1
  max_epochs: 10
  num_sanity_val_steps: 0
  # ≤ batches per epoch (e.g. 42) so Lightning logs during the epoch (default 50 skips all step logs).
  log_every_n_steps: 1
  # Half-precision activations; big VRAM saver. Use 32 if you see NaNs.
  precision: bf16-mixed
  # Two forwards (each data.frames_per_gpu) then one optimizer step; lowers peak VRAM vs one large batch.
  accumulate_grad_batches: 2

checkpoint:
  dirpath: /home/hoangbng/usr_ckpts
