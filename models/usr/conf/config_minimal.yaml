# Minimal Hydra defaults for main.py / main_pre.py / main_self.py / demo.py.
# Generic --config-name config also resolves here via conf/config.yaml.
defaults:
  - checkpoint: last_k
  - data: default
  - debug: no_debug
  - decode: default
  - logger: default
  - logging: default
  - model: default
  - optimizer: default
  - trainer: train
hydra:
  output_subdir: null
  run:
    dir: ${checkpoint.dirpath}/${experiment_name}
project_name: semi_supervised_usr
experiment_name:
num_workers: 8
# Hugging Face Hub per-file download tqdm; set false to show progress bars during cache misses.
hub_disable_progress_bars: true
log_wandb: True
replace_sampler_ddp: False
compile_model: True
fix_seed: True
matmul_precision: highest
ckpt_path:
gpus:
test: False
test_avg: False
txt_file:
slurm_job_id:
